        <mat-form-field appearance="outline" class="mb-4 bold-form" floatLabel="always" 
            style="flex-grow: 2;">
            <mat-label>Procedimiento</mat-label>
            <mat-select formControlName="procedure" placeholder="..." #singleSelect>
                <mat-option>
                    <ngx-mat-select-search [formControl]="procFilterCtrl"
                        placeholderLabel="Buscar por código o palabra clave"
                        noEntriesFoundLabel="'No se encontraron resultados'" [searching]="searchingProcedures">
                    </ngx-mat-select-search>
                </mat-option>
                <mat-option *ngFor="let patient of filtereddataProcedure | async" [value]="patient.id">
                     {{patient.code}} | {{patient.description}}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="close()" [disabled]="sending">Cancelar</button>
    <button mat-flat-button (click)="save()" [disabled]="sending || !procedureForm.valid" color="primary">
        <span *ngIf="!sending">Guardar</span>
        <mat-spinner diameter="24" *ngIf="sending"></mat-spinner>
    </button>
</mat-dialog-actions>
