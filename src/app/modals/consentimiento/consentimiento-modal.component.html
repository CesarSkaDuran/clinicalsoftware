      <mat-form-field appearance="outline" class="blue bold-form" floatLabel="always">
        <mat-label>Detalles</mat-label>
        <textarea ngModel matInput matAutosize matTextareaAutosize formControlName="obs" rows="9"></textarea>
      </mat-form-field>
      <div fxFlex.gt-xs></div>
      <div fxLayout="row" fxLayoutAlign="start center">
        <div fxFlex></div>
        <button mat-stroked-button color="warn" class="color-red" (click)="delete()" [hidden]="!evoId">Eliminar</button>
        <button mat-stroked-button class="ml-6" (click)="close()">Cerrar</button>
        <button [hidden]="evoId" mat-flat-button color="primary" class="ml-6" (click)="save()"
          [disabled]="sending || !obs.valid">
          Guardar
        </button>
        <button [hidden]="!evoId" mat-flat-button color="primary" class="ml-6" (click)="saveDetails()"
