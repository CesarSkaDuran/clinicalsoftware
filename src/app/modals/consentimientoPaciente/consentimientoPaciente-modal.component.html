<div fxLayout="row" fxLayoutAlign="start stretch" class="h-100">
  <div fxLayout="column" fxFlex.gt-xs fxLayoutAlign="start stretch" class="sideform">
    <div fxLayout="row" fxLayoutAlign="start center">
      <h3 class="title mb-4" fxFlex>Consentimiento Informado</h3>
    </div>
    <form fxLayout="column" fxFlex.gt-xs fxLayoutAlign="start stretch" [formGroup]="obs">
      <!-- <perfect-scrollbar fxLayout="column" style="max-height: 428px;padding: 0 18px;"> -->
     <!-- <mat-form-field appearance="outline" class="blue bold-form" floatLabel="always">
       <mat-label>Nombre de personal Médico</mat-label>
        <input matInput formControlName="process" placeholder="..." />
     </mat-form-field> -->
   <div fxLayout="row">
     <mat-form-field appearance="outline" class="bold-form" floatLabel="always" fxFlex.gt-xs>
       <mat-label>Consentimiento</mat-label>
       <mat-select formControlName="nombre" placeholder="nombre" #singleSelect>
         <!-- <mat-option>
           <ngx-mat-select-search [formControl]="diagFilterCtrl" [searching]="searchingDiagnoses"
             placeholderLabel="Buscar por nombre" noEntriesFoundLabel="'no encontrado '"></ngx-mat-select-search>
         </mat-option> -->
         <mat-option *ngFor="let data of consentimiento" (click)="setValorSeleccionado(data.obs)"
           (click)="setDoctorSeleccionado(data.doctor_id)" [value]="data.id">
           {{data.nombre}}
         </mat-option>
       </mat-select>
     </mat-form-field>
              <button>

     <mat-icon (click)="openModal()" style="margin-right: 30px;
                                        margin-top: -15px;
                                        font-size: 50px;
                                        color: indigo;" aria-hidden="false" aria-label="Example home icon">
       add_circle_outline
     </mat-icon>
              </button>
   </div>
   <mat-form-field appearance="outline" class="bold-form" floatLabel="always" fxFlex.gt-xs>
     <mat-label>Doctores</mat-label>
     <mat-select formControlName="doctor_id" placeholder="doctor" #singleSelect>
       <!-- <mat-option>
         <ngx-mat-select-search [formControl]="procFilterCtrl" [searching]="searchingProcedures"
           placeholderLabel="Buscar por nombre" noEntriesFoundLabel="'no encontrado '">
         </ngx-mat-select-search>
       </mat-option> -->
       <mat-option *ngFor="let data of doctores" [value]="data.id">
         {{data.nombre}}
       </mat-option>
     </mat-select>
   </mat-form-field>
       <!-- <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="12px" class="mb-6">
         <mat-checkbox color="primary" formControlName="tests">Médico</mat-checkbox>
         <mat-checkbox color="primary" formControlName="behavior">Enfermera</mat-checkbox>
       </div> -->

      <mat-form-field appearance="outline" class="blue bold-form mb-6" floatLabel="always">
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="datePicker" formControlName="date" placeholder="Seleccione" autocomplete="off"
          required />
        <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
        <mat-datepicker #datePicker></mat-datepicker>
      </mat-form-field>

      <!-- <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="12px" class="mb-6">
        <mat-checkbox color="primary" formControlName="rejuv">Rejuvchip</mat-checkbox>
        <mat-checkbox color="primary" formControlName="mona">Monalisa</mat-checkbox>
      </div> -->
      
      <mat-form-field appearance="outline" class="blue bold-form" floatLabel="always">
        <mat-label>Detalles</mat-label>
        <textarea ngModel matInput matAutosize matTextareaAutosize formControlName="obs" rows="9"></textarea>
      </mat-form-field>
      <div fxFlex.gt-xs></div>
      <div fxLayout="row" fxLayoutAlign="start center">
        <div fxFlex></div>
        <button mat-stroked-button color="warn" class="color-red" (click)="delete()" [hidden]="!evoId">Eliminar</button>
        <button mat-stroked-button class="ml-6" (click)="close()">Cerrar</button>
        <button [hidden]="evoId" mat-flat-button color="primary" class="ml-6" (click)="save()"
          [disabled]="sending || !obs.valid">
          Guardar
        </button>
        <button [hidden]="!evoId" mat-flat-button color="primary" class="ml-6" (click)="saveDetails()"
          [disabled]="sending || !obs.valid">
          Actualizar
        </button>
      </div>
      <!-- </perfect-scrollbar> -->
    </form>
  </div>
</div>
