<vex-page-layout @stagger>
  <vex-page-layout-content fxLayout="column">
    <div fxLayout="row" fxLayoutAlign="start" class="mt-4" fxLayoutGap="16px">
      <div fxLayout="column" fxFlex="270px">
        <div class="home-card p-4 h-100">
      
          <div fxLayout="row" fxLayoutAlign="start center">
            <h3 fxFlex>Calendario</h3>
         
          </div>
          <br>
               <form fxLayout="column"  [formGroup]="filters">
                
                   <mat-form-field [hidden]="true" appearance="outline" style="width: 100%;" fxFlexAlign.xs="stretch"
                     class="blue no-pad bold-form" floatLabel="always">
                     <mat-label>Buscar</mat-label>
                     <input matInput (keyup)="searchKeyUp($event)" #search
                       placeholder="Ingrese nombre de la empresa o el nit" formControlName="search" />
                   </mat-form-field>
                   <mat-form-field appearance="outline" class="mb-4 bold-form" floatLabel="always"
                     style="flex-grow: 2; width:100%">
                     <mat-label>Doctor</mat-label>
                     <mat-select formControlName="doctor">
                         <mat-option (click)="setValorSeleccionado(' ')"
                           value=" ">
                          Todos
                         </mat-option>
                       <mat-option *ngFor="let data of remisiones;" (click)="setValorSeleccionado(data.nombre)"
                         [value]="data.nombre">
                         {{data.nombre}} | {{data.especializacion}}
                       </mat-option>

                     </mat-select>
                   </mat-form-field>
                  <button mat-flat-button color="primary" class="w-100 mt-3" (click)="loadRecords()">Consultar
                    Doctor</button>
               </form>
          <p class="mb-1 mt-3">Antes de agendar verifica el horario del especialista</p>
          <ul class="my-3">
            <li class="mb-2" fxLayout="row" fxLayoutAlign="start center">
              <div class="circle-dot green mr-2"></div> Finalizada</li>
            <li class="mb-2" fxLayout="row" fxLayoutAlign="start center">
              <div class="circle-dot orange mr-2"></div> Por confirmar</li>
            <li class="mb-2" fxLayout="row" fxLayoutAlign="start center">
              <div class="circle-dot blue mr-2"></div> Agendada</li>
            <li class="" fxLayout="row" fxLayoutAlign="start center">
              <div class="circle-dot red mr-2"></div> Cancelada</li>
          </ul>
          <button mat-flat-button color="primary" class="w-100 mt-3" (click)="openAppointmentModal()">NUEVA CITA</button>
        </div>
      </div>
      <div fxLayout="column" fxFlex>
           
            <div class="home-card overflow-auto p-4">
           <full-calendar #calendar [options]="calendarOptions"></full-calendar>      
        </div>
      </div>
    </div>    
  </vex-page-layout-content>


</vex-page-layout>
